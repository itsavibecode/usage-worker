name = "usage-worker"
main = "src/index.js"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Pin to the sevendwarfs Cloudflare account. The default wrangler auth
# on this machine resolves to the umbrella account (frank@umbrellaautomation.com),
# which would silently deploy to the wrong tenant. Pinning here makes
# wrangler fail loudly with a clear "wrong account" error if the env
# token isn't scoped to sevendwarfs. Run `cf sevendwarfs` (PowerShell
# profile helper) before `npx wrangler deploy`.
account_id = "fe16eca597b8d5afa20dfe7b2550640b"

# Daily reorder-reminder cron: 13:00 UTC = 8am US Eastern (9am during EDT).
# Intentionally one hour before stocks-worker's 14:00 cron to spread load.
[triggers]
crons = ["0 13 * * *"]

[vars]
# Firebase project for the usage-tracker app (NOT the same project as stocks).
# Public ID — already exposed in the app's firebase-init.js.
FIREBASE_PROJECT_ID = "product-usage-37f1d"

# Single-user (Path B) configuration. UID is public-equivalent (it's the
# Firebase auth subject). To find yours: open Firebase console for this
# project → Authentication → Users tab → copy the User UID column for
# your account.
OWNER_UID = "MZLlmqIYiZg4H9BLB3iJucfy9uY2"

# Resend From-address.
#
# v0.3.6: notify.rizzo.cc, now that RESEND_API_KEY points at the Resend account
# where that domain is verified (the same account clover-worker and
# pawprints-worker use). The app-specific "usage@" local-part keeps sends
# distinguishable in the Resend log from Clover's and PawPrints' noreply@.
#
# History worth keeping: v0.3.2 set this to notify.rizzo.cc while the key still
# belonged to the stocks.bookhockeys.com account, so Resend rejected every send
# with 403 "domain is not verified" and the breakage sat unnoticed — the worker
# only calls Resend when something crosses the reorder threshold. v0.3.5
# reverted it; v0.3.6 restores it properly with the matching key.
#
# The rule this cost us: SENDER_FROM and RESEND_API_KEY must move together, and
# a sender change isn't "done" until POST /test-email returns a real resendId.
SENDER_FROM = "Usage Tracker <usage@notify.rizzo.cc>"

# Optional: an HTTP endpoint for manual test triggers. If you set
# MANUAL_TRIGGER_KEY as a secret, you can hit /trigger?key=... to fire the
# reminder logic without waiting for the cron. Useful for verifying
# wiring during deployment.

# Secrets — set via `wrangler secret put`, never committed:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON   # service account JSON for product-usage-37f1d
#   wrangler secret put RESEND_API_KEY                  # same key as stocks-worker (single Resend account)
#   wrangler secret put MANUAL_TRIGGER_KEY              # optional — random string, used by /trigger endpoint
